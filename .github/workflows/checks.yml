name: Validar aplicativo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r territorial/requirements.txt
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_hexagonal.py
      - name: Comprobar sintaxis JavaScript
        run: find frontend/shared/js frontend/mobile/js frontend/web/js docs/wireframes -name '*.js' -print0 | xargs -0 -n1 node --check
