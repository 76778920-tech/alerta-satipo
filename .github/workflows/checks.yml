name: CI/CD Firebase
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  web:
    name: Web y backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run build:api
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci-cd/requirements.txt
      - run: python -m pip install -r ci-cd/requirements.txt
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_hexagonal.py
      - name: Comprobar sintaxis JavaScript
        run: find frontend/shared/js frontend/mobile/js frontend/web/js docs/wireframes -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Guardar capturas del recorrido de prueba
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capturas-web-${{ github.sha }}
          path: test-results/*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Preparar hosting con configuracion publica
        env:
          SATIPO_MODE: supabase
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SATIPO_API_URL: ${{ vars.SATIPO_API_URL }}
        run: npm run build:hosting
      - name: Identificar la version publicada
        run: node -e "require('fs').writeFileSync('dist/deployment.json', JSON.stringify({commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID}))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firebase-hosting-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
  mobile:
    name: Flutter Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-pruebas-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
  deploy:
    name: Publicar en Firebase Hosting
    needs: [web, mobile]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firebase-hosting-${{ github.sha }}
          path: dist
      - name: Verificar credencial de despliegue
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          test -n "$SUPABASE_ACCESS_TOKEN"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:api
      - name: Publicar el backend comprobado
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@3.1.0 functions deploy admin-api --workdir database --remote=ddfmooylklgwnrmlxqzc --use-api --yes
      - name: Verificar la version real del backend
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SATIPO_API_URL: ${{ vars.SATIPO_API_URL }}
        run: node ci-cd/check-api-deployment.mjs
      - name: Desplegar la version comprobada
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: alerta-satipo-76778920
          channelId: live
      - name: Comprobar el sitio publicado
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node ci-cd/check-deployment.mjs
