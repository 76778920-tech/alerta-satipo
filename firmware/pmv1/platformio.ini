[platformio]
default_envs = esp32s3-simulation

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  bblanchon/ArduinoJson@7.2.1
  adafruit/Adafruit BME280 Library@2.2.4
  adafruit/Adafruit PM25 AQI Sensor@1.2.0
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3-simulation]
build_flags = ${env.build_flags} -D PMV1_SIMULATION=1

[env:esp32s3-sensors]
build_flags = ${env.build_flags} -D PMV1_SIMULATION=0

[env:esp32s3-ble-simulation]
build_flags = ${env.build_flags} -D PMV1_SIMULATION=1 -D PMV1_BLE=1

[env:esp32s3-ble-sensors]
build_flags = ${env.build_flags} -D PMV1_SIMULATION=0 -D PMV1_BLE=1
